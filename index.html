<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>body{margin:0}img{max-width:100%}</style>
<title>Cicciobomba</title>
<meta name="description" content="Matteo ha il corpo rotondo e il potere di rotolare: mangia la pizza e non esplodere!">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cicciobomba">
<meta property="og:title" content="Cicciobomba">
<meta property="og:description" content="Matteo ha il corpo rotondo e il potere di rotolare: mangia la pizza e non esplodere!">
<meta property="og:url" content="https://davideerusso.github.io/cicciobomba/">
<meta property="og:image" content="https://davideerusso.github.io/cicciobomba/assets/anteprima.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Cicciobomba">
<meta name="twitter:description" content="Matteo ha il corpo rotondo e il potere di rotolare: mangia la pizza e non esplodere!">
<meta name="twitter:image" content="https://davideerusso.github.io/cicciobomba/assets/anteprima.jpg?v=2">
<link rel="icon" href="https://davideerusso.github.io/cicciobomba/assets/icona.png?v=1">
<link rel="apple-touch-icon" href="https://davideerusso.github.io/cicciobomba/assets/icona.png?v=1">
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Baloo+2:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=130">

<div id="schermo">
<canvas id="d2" aria-label="Gioco Cicciobomba"></canvas>
<div id="tocchi" hidden></div>

<div id="hud" hidden>
  <div class="hudriga">
    <div class="sx"><div id="cuori" class="cuori" aria-label="Vite"></div><div id="fiato" aria-label="Fiato"><span>fiato</span><div class="barra"><div id="fiatoB"></div></div></div></div>
    <div id="nomeTappa"></div>
    <div class="gettoni"><span id="gett">0</span> <img id="icMoneta" alt="" width="32" height="32" style="vertical-align:-9px"></div>
    <div class="dx"><div id="carica" aria-label="Carica della bomba"><img id="icBomba" alt="" width="30" height="30"><div class="barra"><div id="caricaB"></div></div></div><button id="pausa" class="btn piccolo" aria-label="Pausa">II</button></div>
  </div>
  <div id="bossBox" class="bossbar" hidden><div id="bossNome"></div><div class="barra"><div id="bossHp"></div></div></div>
</div>
<div id="comandi" hidden aria-hidden="true"><i id="tSin" class="tasto freccia"><svg viewBox="0 0 48 48"><path d="M21 12 9 24l12 12M9 24h15M30 24h8"/></svg></i><i id="tDes" class="tasto freccia"><svg viewBox="0 0 48 48"><path d="M21 12 9 24l12 12M9 24h15M30 24h8"/></svg></i><i id="tScatto" class="tasto tondo"><svg viewBox="0 0 48 48"><path d="M27 7 13 27h10l-2 14 14-20H25z"/></svg></i><i id="tSalto" class="tasto tondo"><svg viewBox="0 0 48 48"><path d="m12 24 12-12 12 12M16 35l8-8 8 8"/></svg></i></div>
<div id="avviso" hidden></div>
<div id="grande" hidden></div>

<section id="sMenu">
  <h1 class="mTesta"><img id="logo" alt="Cicciobomba" width="1200" height="564"></h1>
  <div class="mPulsanti">
    <button id="bAmici" class="mBtn">Skin</button>
    <button id="bGioca" class="mBtn mGioca">Gioca</button>
    <button id="bGuida" class="mBtn">Come si gioca</button>
  </div>
  <div class="mPiede"><span id="record" hidden></span><small id="noteComandi">Tieni il telefono in orizzontale. Una sola corsa: se finisci i cuori riparti da capo.</small></div>
</section>

<section id="sGuida" hidden>
  <div class="gTesta"><h2 id="gTit"></h2><span id="gNum"></span></div>
  <div class="gCarte">
    <figure><canvas id="gc0" width="600" height="360"></canvas><figcaption id="gt0"></figcaption></figure>
    <figure><canvas id="gc1" width="600" height="360"></canvas><figcaption id="gt1"></figcaption></figure>
    <figure><canvas id="gc2" width="600" height="360"></canvas><figcaption id="gt2"></figcaption></figure>
  </div>
  <div class="gPiede"><button id="gSalta" class="btn piccolo">Salta</button><button id="gAvanti" class="btn primo">Avanti</button></div>
</section>

<section id="sAmici" class="tavola" hidden>
  <div class="intesta"><h2>Skin</h2><button id="amiciChiudi" class="btn piccolo">Fatto</button></div>
  <div class="intesta"><h3>Skin</h3><span style="font-weight:800"><span id="saldo">0</span> bocconi</span></div>
  <div id="listaSkin" class="griglia"></div>
</section>

<section id="sPausa" class="tavola centro" hidden>
  <h2>Pausa</h2>
  <button id="bRiprendi" class="btn primo">Riprendi</button>
  <div class="riga"><button id="bAudio" class="btn piccolo">Audio: sì</button><button id="bEsci" class="btn piccolo">Esci</button></div>
</section>

<section id="sConsiglio" class="tavola centro" hidden>
  <h2>Consiglio</h2>
  <p id="consTesto"></p>
  <button id="consAvanti" class="btn primo" aria-label="Avanti">Avanti ➜</button>
</section>

<section id="sFine" class="tavola centro" hidden>
  <h2 id="fineTitolo"></h2>
  <p id="fineTesto"></p>
  <button id="bAvanti" class="btn primo"></button>
  <button id="bTappe" class="btn">Menu</button>
</section>

<div id="velo" aria-hidden="true"></div>
<div id="lampo" aria-hidden="true"></div>
<div id="erroreT" hidden>Il gioco non è riuscito a partire. Controlla la connessione e ricarica la pagina.</div>

</div>
<script src="game.js?v=130"></script>

</body></html>
